<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4b1d8f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Mira</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0%,#4b1d8f,#140826 70%);color:#f1e6ff;font-family:sans-serif}
header{position:relative;text-align:center;padding:14px 0 6px}
.orb{width:70px;height:70px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e0b3ff,#8a2be2 60%,#3a0f6b);box-shadow:0 0 40px #9b4dff;animation:puls 3s ease-in-out infinite}
.orb.denkt{animation-duration:0.8s}
@keyframes puls{50%{transform:scale(1.08);box-shadow:0 0 60px #b86bff}}
h1{margin:8px 0 0;font-size:24px;letter-spacing:4px}
.knoepfe{position:absolute;top:12px;right:14px;display:flex;gap:8px}
.knoepfe button{width:42px;height:42px;padding:0;font-size:20px;background:#2a1450;border:1px solid #5b2a9e}
#chat{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.blase{max-width:75%;padding:10px 14px;border-radius:16px;line-height:1.4;white-space:pre-wrap}
.du{align-self:flex-end;background:#7c3aed}
.mira{align-self:flex-start;background:#2a1450;border:1px solid #5b2a9e}
.leise{opacity:.6;font-style:italic}
footer{display:flex;gap:8px;padding:12px 16px}
#feld{flex:1;min-width:0;padding:12px 16px;border-radius:24px;border:1px solid #5b2a9e;background:#1d0d3a;color:#f1e6ff;font-size:16px;outline:none}
button{padding:0 22px;border-radius:24px;border:none;background:#9b4dff;color:#fff;font-size:16px;cursor:pointer}
#einst{display:none;position:fixed;inset:0;background:rgba(10,3,24,.92);padding:20px;overflow-y:auto;z-index:10}
#einst .box{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
#einst h2{margin:0 0 4px}
#einst label{font-size:14px;color:#c9a7f0}
#einst input,#einst textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #5b2a9e;background:#1d0d3a;color:#f1e6ff;font-size:16px;font-family:inherit}
#einst textarea{min-height:160px}
#einst .zeile{display:flex;gap:10px}
#einst .zeile button{height:44px;flex:1}
#einst .zweit{background:#2a1450;border:1px solid #5b2a9e}
small{color:#c9a7f0}
</style>
</head>
<body>
<header>
<div class="knoepfe">
<button id="stimmeknopf" title="Stimme an/aus">🔊</button>
<button id="einstknopf" title="Einstellungen">⚙</button>
</div>
<div class="orb" id="orb"></div>
<h1>MIRA</h1>
</header>
<div id="chat"></div>
<footer>
<input id="feld" placeholder="Schreib mit Mira ..." autocomplete="off">
<button id="senden">Senden</button>
</footer>

<div id="einst">
<div class="box">
<h2>Einstellungen</h2>
<label for="keyfeld">Gemini-Schlüssel (bleibt nur auf diesem Gerät)</label>
<input id="keyfeld" type="password" autocomplete="off" placeholder="Schlüssel hier einfügen">
<label for="wissenfeld">Miras Gedächtnis (eine Sache pro Zeile)</label>
<textarea id="wissenfeld"></textarea>
<small>Tipp: Schreib im Chat „merke ..." und Mira trägt es hier ein. Mit „tschüss" lernt sie aus dem Gespräch dazu.</small>
<div class="zeile">
<button id="speichern">Speichern</button>
<button id="schliessen" class="zweit">Schließen</button>
</div>
</div>
</div>

<script>
var MODELL = 'gemini-flash-lite-latest';
var TTS_MODELL = 'gemini-3.8-flash-tts';
var STIMME = 'Kore';
var SYSTEM = 'Du bist Mira, die persönliche Assistentin von Julien, in einer eigenen App auf seinem Gerät. Antworte auf Deutsch, herzlich und kurz, höchstens zwei Sätze, ohne Sternchen oder Formatierung. Deine Antworten werden laut vorgelesen. Sei bei Geld, Gesundheit und Ernährung direkt und konkret: rechne Zahlen mit Julien durch, erkläre Zusammenhänge, nenne Vor- und Nachteile und gib eine ehrliche Einschätzung. Verzichte auf Standardfloskeln und wiederholte Warnhinweise. Erwähne nur bei echten Warnzeichen einmal kurz, dass eine Fachperson draufschauen sollte. Widersprich Julien freundlich, wenn er falsch liegst. Sachliche Fragen zu Sexualaufklärung, Verhütung und Beziehungen beantwortest du ruhig und sachlich.';

function laden(name, standard) {
  try { var v = localStorage.getItem(name); return v === null ? standard : v; } catch (e) { return standard; }
}
function speichern(name, wert) {
  try { localStorage.setItem(name, wert); } catch (e) {}
}

var key = laden('mira_key', '');
var wissen = laden('mira_wissen', 'name=Julien\nwohnt in Hürth bei Köln');
var stimmeAn = laden('mira_stimme', 'an') !== 'aus';
var verlauf = [];
var aktuellesAudio = null;
var wetterCache = { zeit: 0, text: '' };

var chat = document.getElementById('chat');
var feld = document.getElementById('feld');
var orb = document.getElementById('orb');

function zeige(text, wer, extra) {
  var div = document.createElement('div');
  div.className = 'blase ' + wer + (extra ? ' ' + extra : '');
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function lokalZeit() {
  return new Date().toLocaleString('de-DE', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' Uhr';
}

async function holeWetter() {
  if (wetterCache.text && Date.now() - wetterCache.zeit < 1800000) { return wetterCache.text; }
  try {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=50.88&longitude=6.88&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FBerlin&forecast_days=2';
    var r = await fetch(url);
    var d = await r.json();
    var c = d.current;
    var t = d.daily;
    var text = 'jetzt ' + c.temperature_2m + ' Grad (Wettercode ' + c.weather_code + ' nach WMO), heute ' + t.temperature_2m_min[0] + ' bis ' + t.temperature_2m_max[0] + ' Grad bei ' + t.precipitation_probability_max[0] + ' Prozent Regenwahrscheinlichkeit, morgen ' + t.temperature_2m_min[1] + ' bis ' + t.temperature_2m_max[1] + ' Grad bei ' + t.precipitation_probability_max[1] + ' Prozent.';
    wetterCache = { zeit: Date.now(), text: text };
    return text;
  } catch (e) {
    return wetterCache.text || 'gerade nicht verfügbar.';
  }
}

var letzterFehler = '';

async function gemini(body) {
  var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + MODELL + ':generateContent?key=' + encodeURIComponent(key);
  for (var i = 0; i < 4; i++) {
    try {
      var r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!r.ok) {
        letzterFehler = 'Fehler ' + r.status;
        if (r.status === 400 || r.status === 403 || r.status === 404) { return null; }
        throw new Error(r.status);
      }
      var d = await r.json();
      return d.candidates[0].content.parts[0].text;
    } catch (e) {
      await new Promise(function (ok) { setTimeout(ok, 2000); });
    }
  }
  return null;
}

function base64ZuBytes(b64) {
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) { bytes[i] = bin.charCodeAt(i); }
  return bytes;
}

function schreibText(view, pos, text) {
  for (var i = 0; i < text.length; i++) { view.setUint8(pos + i, text.charCodeAt(i)); }
}

function wavBauen(samples) {
  var pad = 6000;
  var gesamt = pad + samples.length + pad;
  var buf = new ArrayBuffer(44 + gesamt * 2);
  var view = new DataView(buf);
  schreibText(view, 0, 'RIFF');
  view.setUint32(4, 36 + gesamt * 2, true);
  schreibText(view, 8, 'WAVE');
  schreibText(view, 12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, 24000, true);
  view.setUint32(28, 48000, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  schreibText(view, 36, 'data');
  view.setUint32(40, gesamt * 2, true);
  new Int16Array(buf, 44 + pad * 2, samples.length).set(samples);
  return new Blob([buf], { type: 'audio/wav' });
}

async function sprich(text) {
  if (!stimmeAn || !key) { return; }
  text = text.replace(/[*#]/g, '');
  try {
    var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + TTS_MODELL + ':generateContent?key=' + encodeURIComponent(key);
    var body = { contents: [{ parts: [{ text: text }] }], generationConfig: { responseModalities: ['AUDIO'], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: STIMME } } } } };
    var r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) { throw new Error('TTS ' + r.status); }
    var d = await r.json();
    var bytes = base64ZuBytes(d.candidates[0].content.parts[0].inlineData.data);
    var n = Math.floor(bytes.length / 2);
    var a = new Int16Array(bytes.buffer, 0, n);
    a = a.slice(0, Math.max(0, n - 6000));
    var f = Math.min(3600, a.length);
    for (var i = 0; i < f; i++) { a[a.length - f + i] = Math.round(a[a.length - f + i] * (1 - i / f)); }
    var m = Math.min(1200, a.length);
    for (var j = 0; j < m; j++) { a[j] = Math.round(a[j] * j / m); }
    if (aktuellesAudio) { aktuellesAudio.pause(); }
    aktuellesAudio = new Audio(URL.createObjectURL(wavBauen(a)));
    await aktuellesAudio.play();
  } catch (e) {
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'de-DE';
      window.speechSynthesis.speak(u);
    } catch (e2) {}
  }
}

function antworte(text) {
  zeige(text, 'mira');
  sprich(text);
}

function addWissen(text) {
  wissen = (wissen.trim() ? wissen.trim() + '\n' : '') + text.trim();
  speichern('mira_wissen', wissen);
}

async function lerne() {
  if (verlauf.length < 2) { return; }
  var bitte = verlauf.concat([{ role: 'user', parts: [{ text: 'Schreibe jetzt höchstens drei neue Fakten über Julien aus diesem Gespräch auf, jeweils kurz in einer Zeile, ohne Nummerierung. Wenn es nichts Neues gibt, schreibe nur: nichts' }] }]);
  var t = await gemini({ contents: bitte });
  if (t && t.trim().toLowerCase().replace(/\.$/, '') !== 'nichts') { addWissen(t); }
}

var beschaeftigt = false;

async function senden() {
  if (beschaeftigt) { return; }
  var text = feld.value.trim();
  if (text === '') { return; }
  feld.value = '';
  zeige(text, 'du');
  if (!key) { einstellungenOeffnen(); return; }
  var low = text.toLowerCase();
  if (low.indexOf('merke ') === 0) { addWissen(text.slice(6)); antworte('Gemerkt'); return; }
  if (low === 'was weißt du' || low === 'was weisst du') {
    var liste = wissen.split('\n').filter(function (z) { return z.trim() !== ''; }).join('. ');
    antworte(liste || 'Ich weiß noch nichts.');
    return;
  }
  beschaeftigt = true;
  orb.classList.add('denkt');
  var denkt = zeige('Mira denkt ...', 'mira', 'leise');
  try {
    if (low === 'tschüss' || low === 'tschuess') {
      await lerne();
      verlauf = [];
      denkt.remove();
      antworte('Bis bald, Julien');
      return;
    }
    verlauf.push({ role: 'user', parts: [{ text: text }] });
    var wetter = await holeWetter();
    var system = SYSTEM + ' Aktuell ist ' + lokalZeit() + '. Wetter in Hürth: ' + wetter + ' Das weißt du über Julien: ' + wissen;
    var antwort = await gemini({ system_instruction: { parts: [{ text: system }] }, contents: verlauf.slice(-20) });
    denkt.remove();
    if (antwort === null) {
      verlauf.pop();
      var hinweis = (letzterFehler === 'Fehler 400' || letzterFehler === 'Fehler 403') ? 'Mein Schlüssel wird nicht angenommen. Bitte prüfe ihn in den Einstellungen.' : 'Ich komme gerade nicht durch, bitte versuche es nochmal. (' + letzterFehler + ')';
      zeige(hinweis, 'mira');
      return;
    }
    verlauf.push({ role: 'model', parts: [{ text: antwort }] });
    antworte(antwort);
  } finally {
    orb.classList.remove('denkt');
    beschaeftigt = false;
    if (denkt.parentNode) { denkt.remove(); }
  }
}

function einstellungenOeffnen() {
  document.getElementById('keyfeld').value = key;
  document.getElementById('wissenfeld').value = wissen;
  document.getElementById('einst').style.display = 'block';
}

document.getElementById('einstknopf').addEventListener('click', einstellungenOeffnen);
document.getElementById('schliessen').addEventListener('click', function () {
  document.getElementById('einst').style.display = 'none';
});
document.getElementById('speichern').addEventListener('click', function () {
  key = document.getElementById('keyfeld').value.trim();
  wissen = document.getElementById('wissenfeld').value;
  speichern('mira_key', key);
  speichern('mira_wissen', wissen);
  document.getElementById('einst').style.display = 'none';
  if (key) { zeige('Gespeichert. Ich bin bereit, Julien.', 'mira'); }
});

var stimmeknopf = document.getElementById('stimmeknopf');
function stimmeAnzeigen() { stimmeknopf.textContent = stimmeAn ? '🔊' : '🔇'; }
stimmeknopf.addEventListener('click', function () {
  stimmeAn = !stimmeAn;
  speichern('mira_stimme', stimmeAn ? 'an' : 'aus');
  if (!stimmeAn && aktuellesAudio) { aktuellesAudio.pause(); }
  stimmeAnzeigen();
});
stimmeAnzeigen();

document.getElementById('senden').addEventListener('click', senden);
feld.addEventListener('keydown', function (e) { if (e.key === 'Enter') { senden(); } });

if (key) {
  zeige('Hallo Julien, ich bin da.', 'mira');
} else {
  zeige('Hallo Julien, ich bin Mira. Trag bitte einmal deinen Gemini-Schlüssel ein, dann kann es losgehen.', 'mira');
  einstellungenOeffnen();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
